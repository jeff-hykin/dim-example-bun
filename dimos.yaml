# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: Example (Bun)
version: "0.3.0"
spec-version: v1.5
uses:
    "@zenoh-gateway": ">=0.5 <0.6" # also covers dimos-react finding it: GET /gateways/desktop/management/gateways/zenoh
    "@desktop-gateway":
        # spec v1.5: the values this server needs of Desktop's environment, keyed per value of DIMOS_APP rather than
        # per variable (every app gets DIMOS_APP, so naming the variable says nothing). `app check` reports one
        # Desktop doesn't set, and a launch that can't resolve one says so in the app's own log. No endpoints here:
        # this app calls Desktop's own API for nothing.
        env:
            DIMOS_APP.socket: the unix socket this server binds (--port stands in outside Desktop)
            DIMOS_APP.name: the name this app was installed under
            DIMOS_APP.zenohConnect:
                required: false
                description: the zenoh endpoint its own session dials
            DIMOS_APP.zenohPrefix:
                required: false
                description: this app's own subtree of the namespace
# what the agent and other apps may call: an OpenAPI 3.1 document, its paths relative to the app
provides:
    openapi: 3.1.0
    info:
        title: Example (Bun)
        version: 1.0.0 # this API's version: major = breaking, minor = added
        description: 'Example (Bun): a showcase dimOS app; its Bun server publishes live data over zenoh (zenoh-bun)'
        x-when: you want to check that the Bun example app's server is alive
    x-private: # paths only this app's own pages may call
        - api/internal/*
    paths:
        /api/hello:
            get:
                description: >-
                    Who this app is and how its server is doing. Takes nothing; answers JSON: shape ("Bun"), app (its name),
                    bun (the Bun version), uptimeS (seconds its server has been up), zenoh ("connected" or "unavailable"),
                    published (how many stats samples it has published on zenoh) and statsKey (the zenoh key it publishes
                    on)
                x-when: you need to know whether the Bun example's server and zenoh are up
                x-dimos-role: context # added to the agent's desktop_context() while the app is focused
# spec v1.2: what the page may do on zenoh, as zenoh's ACL config (deny by default). The page only listens to its own
# server: <namespace>/apps/dim-example-bun/frontend/** (stats, echo, and dimos-react's url events).
zenoh:
    default_permission: deny
    read:
        - id: own-frontend-topics
          messages: [declare_subscriber, put] # open the subscription, and receive its samples
          key_exprs: ["dimos-desktop/*/apps/dim-example-bun/frontend/**"]
          permission: allow
