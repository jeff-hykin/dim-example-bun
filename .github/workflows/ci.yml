name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3 # nixos-25.11's, what dimosApp runs
      - run: bun install --frozen-lockfile
      - name: smoke run (the server starts and answers)
        run: |
          bun run server/main.ts --port 8788 &
          for i in $(seq 30); do curl -fs localhost:8788/api/hello && break; sleep 1; done
          curl -fs localhost:8788/ | grep -q dimos-react
      - name: dimos.yaml check
        run: |
          curl -fsSL -o dimos-desktop https://github.com/jeff-hykin/dimos-desktop-mirror/releases/latest/download/dimos-desktop-x86_64-unknown-linux-gnu
          chmod +x dimos-desktop
          ./dimos-desktop app check .
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # what Desktop runs on install
      - run: nix build .#dimosApp --print-build-logs
