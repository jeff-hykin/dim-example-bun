<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="Example (Bun)">
  <!-- dimOS app icon set v6: dark glass tile tinted to the glyph, neon gradient glyph with a soft bloom -->
  <defs>
    <radialGradient id="tile" cx=".5" cy=".18" r=".95"><stop offset="0" stop-color="#0c2a3a"/><stop offset="1" stop-color="#07070f"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="50"><stop offset="0" stop-color="#a6f0ff"/><stop offset="1" stop-color="#2d8cff"/></linearGradient>
    <g id="glyph">
      <path d="M15 37C15 26 23 19 32 19C41 19 49 26 49 37C49 42 44 45 32 45C20 45 15 42 15 37Z" fill="none" stroke="url(#a)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M24 28C25 31 25 34 24 37M32 26C33 30 33 34 32 38M40 28C39 31 39 34 40 37" fill="none" stroke="url(#a)" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".7"/>
      <circle cx="47" cy="47" r="2.6" fill="url(#a)"/></g>
    <linearGradient id="scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#e2e2e2"/><stop offset=".5" stop-color="#c2c2c2"/><stop offset=".75" stop-color="#e2e2e2"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#scanrow)"/></pattern>
    <mask id="scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#scan)"/></mask>
    <filter id="core" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="erode" radius="0.9" result="e"/><feGaussianBlur in="e" stdDeviation="0.45" result="eb"/><feFlood flood-color="#fffaf0" flood-opacity=".78"/><feComposite in2="eb" operator="in" result="c"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="c"/></feMerge></filter>
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#glyph" filter="url(#bloom)"/>
    <g mask="url(#scanlines)"><use href="#glyph" filter="url(#core)"/></g>
  </g>
</svg>
